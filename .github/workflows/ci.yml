name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest
        run: npm test -- --runInBand

  python-smoke:
    # Keep this check name stable because main branch protection requires it.
    name: Python Ops Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/ci/requirements-smoke.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/ci/requirements-smoke.txt

      - name: Run full Python test suite
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Run reload/score stress harness self-test
        run: python scripts/stress_ml_reload_score.py --self-test --duration-sec 1.5 --score-workers 3 --reload-interval-ms 80 --fail-on-error

  python-fast:
    # Display name retained for branch-protection check-name stability. This job
    # now runs ONLY the research-protocol unit tests (tests/unit/…) — the one
    # suite the full tests/python discovery in "Python Ops Smoke" does not cover.
    # The trading-calendar, prediction-log, sklearn-compat, and levels-product
    # suites it used to run are now exercised there, so re-running them here was
    # pure duplication.
    name: Python Fast Tests (prediction-log + sklearn compat + research protocol)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No cache: pip here — we install a single package inline and have no
          # requirements.txt / pyproject.toml for setup-python to key on.

      - name: Install test dependencies
        # pandas: needed by test_audit_logger (exercises hash_dataframe_schema_or_csv).
        # The rest of the research-protocol suite is stdlib-only.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.2.3"

      - name: Research-protocol unit tests
        run: python -m unittest discover -s tests/unit/test_research_protocol -p "test_*.py" -v

  python-coverage:
    # Report-only coverage across ALL Python suites (tests/python, the
    # research-protocol unit tests, and the daily-report dedup suite), printing a
    # per-file report for the source packages (see .coveragerc). No fail_under,
    # and this job is intentionally NOT a required check, so it never blocks
    # merges — but there is deliberately NO continue-on-error, so if the
    # instrumentation itself breaks (install/run/report) the job goes red and the
    # failure is visible rather than silently green.
    name: Python Coverage (report-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/ci/requirements-smoke.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/ci/requirements-smoke.txt
          python -m pip install "coverage==7.6.1"

      - name: Run tests under coverage (report-only; not a required check)
        run: |
          coverage run -m unittest discover -s tests/python -p "test_*.py"
          coverage run --append -m unittest discover -s tests/unit/test_research_protocol -p "test_*.py"
          coverage run --append tests/test_daily_report_dedup.py
          coverage report
